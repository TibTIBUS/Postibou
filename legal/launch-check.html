<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vérification privée — Postibou</title><style>body{font:18px/1.6 system-ui;max-width:850px;margin:40px auto;padding:20px}pre{white-space:pre-wrap}</style><h1>Vérification privée de production</h1><p>Réservée au compte propriétaire connecté. Aucun paiement ni secret affiché.</p><pre id="result">Vérification en cours…</pre><button id="check" type="button">Vérifier Checkout sans paiement</button><pre id="checkout"></pre><p><a href="/">Revenir à Postibou</a></p><script>fetch("/api/launch-preflight",{credentials:"same-origin",cache:"no-store"}).then(async r=>{document.getElementById("result").textContent=JSON.stringify(await r.json(),null,2)}).catch(()=>{document.getElementById("result").textContent="Vérification indisponible"});document.getElementById("check").onclick=async()=>{document.getElementById("check").disabled=true;try{const r=await fetch("/api/launch-preflight",{method:"POST",credentials:"same-origin"});document.getElementById("checkout").textContent=JSON.stringify(await r.json(),null,2)}catch{document.getElementById("checkout").textContent="Test indisponible"}}</script></html>
